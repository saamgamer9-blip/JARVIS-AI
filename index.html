<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Live Voice Assistant</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --surface-color: #161b22;
      --text-color: #e6edf3;
      --accent-color: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding-bottom: 10px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-color);
    }

    #chatContainer {
      flex: 1;
      width: 100%;
      max-width: 600px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px 0;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 1rem;
      line-height: 1.4;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--accent-color);
      color: #0d1117;
      font-weight: 500;
      border-bottom-right-radius: 2px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--surface-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 2px;
    }

    /* Voice Visualiser */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      height: 40px;
      margin: 10px 0;
    }

    .wave-bar {
      width: 4px;
      height: 12px;
      background-color: var(--accent-color);
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .wave-bar.active {
      animation: pulse 0.8s infinite ease-in-out alternate;
    }

    @keyframes pulse {
      0% { height: 12px; }
      100% { height: 36px; }
    }

    .controls {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding-top: 10px;
    }

    #voiceBtn {
      background-color: var(--accent-color);
      color: #0d1117;
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: transform 0.2s, background-color 0.2s;
    }

    #voiceBtn:hover {
      transform: scale(1.08);
    }

    #voiceBtn.Listening {
      background-color: #ff7b72;
      box-shadow: 0 0 20px rgba(255, 123, 114, 0.6);
    }

    #statusText {
      font-size: 0.9rem;
      color: #8b949e;
      min-height: 1.25rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S. Live</h1>
  </header>

  <div id="chatContainer">
    <div class="message ai">
      Salaan! Diyaar ayaan u ahay inaan kugu caawiyo wadahadal toos ah. Taabo badhanka hoose si aad u bilowdo.
    </div>
  </div>

  <div class="visualizer" id="visualizer">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>

  <div class="controls">
    <div id="statusText">Riix badhanka si aad u hadasho</div>
    <button id="voiceBtn" aria-label="Microphone">🎙️</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const voiceBtn = document.getElementById('voiceBtn');
    const statusText = document.getElementById('statusText');
    const waveBars = document.querySelectorAll('.wave-bar');

    let recognition;
    let isListening = false;

    // Hubso taageerada Browser-ka
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'so-SO'; // Ku hagaaji luuqadda la rabo
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('Listening');
        voiceBtn.textContent = '⏹️';
        statusText.textContent = 'Waan ku dhagaysanayaa...';
        toggleVisualizer(true);
      };

      recognition.onend = () => {
        isListening = false;
        voiceBtn.classList.remove('Listening');
        voiceBtn.textContent = '🎙️';
        statusText.textContent = 'Riix badhanka si aad u hadasho';
        toggleVisualizer(false);
      };

      recognition.onresult = (event) => {
        const userText = event.results[0][0].transcript;
        appendMessage(userText, 'user');
        generateAIResponse(userText);
      };
    } else {
      statusText.textContent = 'Browser-kaagu ma taageero aqoonsiga codka.';
      voiceBtn.disabled = true;
    }

    voiceBtn.addEventListener('click', () => {
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      if (sender === 'ai') {
        speakResponse(text);
      }
    }

    function toggleVisualizer(active) {
      waveBars.forEach(bar => {
        if (active) bar.classList.add('active');
        else bar.classList.remove('active');
      });
    }

    // Simulada garashada iyo ka jawaabida AI
    function generateAIResponse(userText) {
      statusText.textContent = 'JARVIS wuu ka fikirayaa...';
      toggleVisualizer(false);
      
      setTimeout(() => {
        let reply = "Waan helay farriintaada. Aad ayaan ugu faraxsanahay inaan kaa caawiyo.";
        if (userText.toLowerCase().includes("sidee")) {
          reply = "Anigu si fiican ayaan u shaqaynayaa, mahadsanid!";
        } else if (userText.toLowerCase().includes("magaca")) {
          reply = "Magacaygu waa JARVIS, kaaliyahaaga gaarka ah.";
        }
        appendMessage(reply, 'ai');
      }, 1000);
    }

    // Ku hadalka jawaabta
    function speakResponse(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Jooji hadalkii hore haddii uu jiray
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'so-SO';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        statusText.textContent = 'Waan akhrinayaa...';
        toggleVisualizer(true);

        utterance.onend = () => {
          statusText.textContent = 'Riix badhanka si aad u hadasho';
          toggleVisualizer(false);
        };

        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
