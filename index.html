<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Gamer Live</title>
  <style>
    :root {
      --bg-overlay: rgba(10, 12, 18, 0.8);
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --active-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
    }

    body {
      background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('sawir.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 15px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff, var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #chatArea {
      flex: 1;
      width: 100%;
      max-width: 600px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 0;
    }

    #chatArea::-webkit-scrollbar {
      width: 4px;
    }

    #chatArea::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .msg {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 24px;
      line-height: 1.5;
      font-size: 1.05rem;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: rgba(30, 41, 59, 0.8);
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .ai {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.9);
      border-bottom-left-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .controls {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .key-box {
      width: 100%;
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.8);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    button#saveBtn {
      background: var(--accent-color);
      color: #05070e;
      border: none;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button#saveBtn:hover {
      opacity: 0.9;
    }

    /* Badhanka dhexe ee isku beddelaya */
    .action-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      cursor: pointer;
      background: var(--accent-color);
      color: #05070e;
      box-shadow: 0 0 40px var(--accent-color);
      transition: all 0.3s ease;
    }

    .action-circle.listening {
      background: var(--active-color);
      color: #fff;
      box-shadow: 0 0 60px var(--active-color);
      transform: scale(1.05);
    }

    .action-circle.speaking {
      background: #10b981;
      color: #fff;
      box-shadow: 0 0 50px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Sam Gamer</h1>
  </header>

  <main id="chatArea">
    <div class="msg ai">Salaan! Taabo badhanka hoose si aan u bilowno wada-hadalka.</div>
  </main>

  <div class="controls">
    <div class="key-box">
      <input type="password" id="apiKeyInput" placeholder="Geli Gemini API Key...">
      <button id="saveBtn">Save</button>
    </div>
    <button id="mainBtn" class="action-circle">🎙️</button>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const mainBtn = document.getElementById('mainBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveBtn = document.getElementById('saveBtn');

    apiKeyInput.value = localStorage.getItem('sam_gamer_key') || '';

    function saveKey() {
      const k = apiKeyInput.value.trim();
      if (k) {
        localStorage.setItem('sam_gamer_key', k);
        apiKeyInput.blur();
        addMsg('Furahaaga waa la kaydiyay.', 'ai');
      }
    }
    saveBtn.addEventListener('click', saveKey);
    apiKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveKey(); });

    function addMsg(text, type) {
      const d = document.createElement('div');
      d.className = 'msg ' + type;
      d.textContent = text;
      chatArea.appendChild(d);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function updateButtonState(state) {
      mainBtn.classList.remove('listening', 'speaking');
      if (state === 'idle') {
        mainBtn.textContent = '🎙️';
      } else if (state === 'listening') {
        mainBtn.classList.add('listening');
        mainBtn.textContent = '🛑';
      } else if (state === 'speaking') {
        mainBtn.classList.add('speaking');
        mainBtn.textContent = '✨';
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      updateButtonState('speaking');
      u.onend = () => updateButtonState('idle');
      u.onerror = () => updateButtonState('idle');
      window.speechSynthesis.speak(u);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec, recording = false;

    if (SpeechRecognition) {
      rec = new SpeechRecognition();
      rec.lang = 'so-SO';
      rec.onstart = () => {
        recording = true;
        updateButtonState('listening');
      };
      rec.onend = () => {
        if (recording) {
          recording = false;
          updateButtonState('idle');
        }
      };
      rec.onresult = (e) => {
        const txt = e.results[0][0].transcript;
        addMsg(txt, 'user');
        askGemini(txt);
      };
      rec.onerror = () => {
        recording = false;
        updateButtonState('idle');
      };
    }

    mainBtn.addEventListener('click', () => {
      if (!rec) {
        alert('Codka laguma taageero browser-kan.');
        return;
      }
      if (recording) {
        recording = false;
        rec.stop();
        updateButtonState('idle');
      } else {
        rec.start();
      }
    });

    async function askGemini(prompt) {
      const key = apiKeyInput.value.trim();
      if (!key) {
        addMsg('Fadlan geli furahaaga API marka hore.', 'ai');
        updateButtonState('idle');
        return;
      }
      try {
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Khalad ayaa dhacay.';
        addMsg(reply, 'ai');
        speak(reply);
      } catch (err) {
        addMsg('Cillad xidhiidhka ah.', 'ai');
        updateButtonState('idle');
      }
    }
  </script>
</body>
</html>
