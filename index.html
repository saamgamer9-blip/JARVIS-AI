<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#051325" />
  <title>JARVIS - Personal AI Assistant</title>
  <style>.video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: linear-gradient(rgba(3, 10, 22, 0.55), rgba(3, 10, 22, 0.65)),
                      url('IMG-20261119-WA0002.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    animation: jarvisMotion 9s ease-in-out infinite alternate;
}

@keyframes jarvisMotion {
    0% {
        transform: scale(1) translateY(0px);
        filter: brightness(0.95) contrast(1.05);
    }
    50% {
        transform: scale(1.04) translateY(-6px);
        filter: brightness(1.08) contrast(1.15);
    }
    100% {
        transform: scale(1.02) translateY(4px);
        filter: brightness(0.98) contrast(1.1);
    }
}

    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: background: background: transparent;

      color: #e6f1ff;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 650px;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    header h1 {
      margin: 0;
      letter-spacing: 4px;
      color: #45d0ff;
    }
    header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.75;
    }
    #clock {
      margin-top: 8px;
      font-size: 13px;
      color: #9ad8ff;
    }
    .panel {
      background: #0a1d30;
      border: 1px solid #24516a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #9ad8ff;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      border-radius: 10px;
      border: 1px solid #2a5d7a;
      background: #061422;
      color: #ffffff;
      padding: 10px;
      font-size: 15px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary {
      background: #1ea7e1;
      color: #04121e;
    }
    .secondary {
      background: #14364c;
      color: #e6f1ff;
      border: 1px solid #2c6282;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #8fd3ff;
    }
    .history {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 340px;
      overflow-y: auto;
    }
    .bubble {
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .user {
      background: #133852;
      align-self: flex-end;
      border: 1px solid #2b688c;
    }
    .jarvis {
      background: #092438;
      align-self: flex-start;
      border: 1px solid #1d4c68;
    }
  </style>
</head>
<body><div class="video-background"></div>
  <main>
    <header>
      <h1>J.A.R.V.I.S.</h1>
      <p>PERSONAL AI ASSISTANT</p>
      <div id="clock"></div>
    </header>

    <section class="panel">
      <label for="command">Su'aashaada / Amarkaaga</label>
      <textarea id="command" placeholder="Tusaale: Fur YouTube, Maxaa la yiraahdaa caasimadda Soomaaliya?"></textarea>
      <div class="row">
        <button class="primary" id="send">Dir</button>
        <button class="secondary" id="voice">Cod (Dhagayso)</button>
        <button class="secondary" id="speakLast">Akhri Jawaabta</button>
      </div>
      <div id="status">Diyaar u ah inuu ku caawiyo.</div>
    </section>

    <section class="panel">
      <label>Wada-hadalka</label>
      <div id="history" class="history"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let lastReply = "Waan ku faraxsanahay inaan kula hadlo. Sideen kuu caawin karaa?";

    function updateClock() {
      $("clock").textContent = new Date().toLocaleString();
    }
    updateClock();
    setInterval(updateClock, 1000);

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        $("status").textContent = "Browser-kan ma taageero codka hadla.";
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "so-SO";
      window.speechSynthesis.speak(utter);
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      $("history").appendChild(div);
      $("history").scrollTop = $("history").scrollHeight;
    }

    function checkAppCommand(text) {
      const lower = text.toLowerCase();
      if (lower.includes("fur youtube") || lower.includes("open youtube")) {
        window.open("https://www.youtube.com", "_blank");
        return "Waxaan furayaa YouTube.";
      }
      if (lower.includes("fur google") || lower.includes("open google")) {
        window.open("https://www.google.com", "_blank");
        return "Waxaan furayaa Google.";
      }
      if (lower.includes("fur whatsapp") || lower.includes("open whatsapp")) {
        window.open("https://wa.me/", "_blank");
        return "Waxaan furayaa WhatsApp.";
      }
      return null;
    }

    async function getFreeReply(text) {
      const appMsg = checkAppCommand(text);
      if (appMsg) return appMsg;

      const q = text.trim();
      const lower = q.toLowerCase();

      if (lower.includes("waqti") || lower.includes("saacad") || lower.includes("time")) {
        return "Waqtigu waa: " + new Date().toLocaleTimeString();
      }
      if (lower.includes("taariikh") || lower.includes("date")) {
        return "Taariikhdu waa: " + new Date().toLocaleDateString();
      }

      try {
        const url = "https://api.duckduckgo.com/?q=" + encodeURIComponent(q) + "&format=json&no_html=1";
        const res = await fetch(url);
        const data = await res.json();
        if (data.AbstractText) {
          return data.AbstractText;
        }
      } catch (e) {
        // Haddii xiriirku dib u dhaco
      }

      return "Waan fahmay amarkaaga: \"" + q + "\". Su'aalaha guud ama furista apps-ka ayaan kaa caawin karaa.";
    }

    async function handleCommand() {
      const text = $("command").value.trim();
      if (!text) return;

      $("command").value = "";
      addMessage("user", text);
      $("status").textContent = "JARVIS wuu ka fikirayaa...";

      const reply = await getFreeReply(text);
      lastReply = reply;
      addMessage("jarvis", reply);
      $("status").textContent = "Jawaabta waa la helay.";
      speak(reply);
    }

    $("send").addEventListener("click", handleCommand);
    $("command").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleCommand();
      }
    });

    $("speakLast").addEventListener("click", () => {
      speak(lastReply);
    });

    $("voice").addEventListener("click", () => {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        $("status").textContent = "Browser-kan ma taageero aqoonsiga codka.";
        return;
      }
      const rec = new SpeechRec();
      rec.lang = "so-SO";
      $("status").textContent = "Waan ku dhagaysanayaa... hadal.";
      rec.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        $("command").value = spoken;
        $("status").textContent = "Codka waa la qoray.";
        handleCommand();
      };
      rec.onerror = () => {
        $("status").textContent = "Codka si fiican looma qaban, mar kale isku day.";
      };
      rec.start();
    });

    addMessage("jarvis", "Salaan! Waxaan ahay JARVIS. Waxaad i weydiin kartaa su'aal ama i weydiiso inaan furo YouTube, Google, ama WhatsApp.");
  </script>
</body>
</html>
