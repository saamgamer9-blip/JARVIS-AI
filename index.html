<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Live Interface</title>
  <style>
    :root {
      --bg-color: #05070e;
      --surface-color: #0f172a;
      --text-color: #f8fafc;
      --text-muted: #64748b;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --danger-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* Main Chat Area */
    #chatArea {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 0;
    }

    #chatArea::-webkit-scrollbar {
      width: 6px;
    }

    #chatArea::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .message {
      max-width: 85%;
      padding: 14px 20px;
      border-radius: 20px;
      font-size: 1rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--surface-color);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-bottom-right-radius: 4px;
      color: #e2e8f0;
    }

    .message.ai {
      align-self: flex-start;
      background: linear-gradient(135deg, #1e293b, var(--surface-color));
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* Controls Section */
    .interface-controls {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px;
    }

    /* API Key Config Panel */
    .config-panel {
      width: 100%;
      background: var(--surface-color);
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="password"] {
      flex: 1;
      background: #05070e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: var(--accent-color);
    }

    /* Voice Visualiser */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      height: 40px;
    }

    .bar {
      width: 4px;
      height: 12px;
      background-color: var(--accent-color);
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .bar.active {
      animation: bounce 1s infinite ease-in-out;
    }

    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { height: 12px; }
      50% { height: 45px; }
    }

    /* Main Interaction Button */
    .action-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #micBtn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-color), #0284c7);
      color: #05070e;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px var(--accent-glow);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    #micBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px var(--accent-glow);
    }

    #micBtn.recording {
      background: var(--danger-color);
      color: #fff;
      box-shadow: 0 0 35px rgba(244, 63, 94, 0.6);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>J.A.R.V.I.S.</h1>
    </div>
    <div class="status-container">
      <div class="indicator"></div>
      <div class="status-text" id="statusText">Diyaar u ah inuu ku maqlo</div>
    </div>
  </header>

  <main id="chatArea">
    <div class="message ai">
      Salaan! Diyaar ayaan u ahay inaan kula hadlo. Geli furahaaga API xagga hoose, ka dibna taabo badhanka makarafoonka si aan u bilowno.
    </div>
  </main>

  <div class="interface-controls">
    <div class="config-panel">
      <input type="password" id="geminiKey" placeholder="Ku dheji Gemini API Key halkan...">
    </div>

    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="action-container">
      <button id="micBtn" aria-label="Microphone">🎙️</button>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const geminiKeyInput = document.getElementById('geminiKey');
    const bars = document.querySelectorAll('.bar');

    let recognition;
    let isRecording = false;

    // Ku shub furaha kaydka haddii uu hore u yiil
    const savedKey = localStorage.getItem('jarvis_api_key');
    if (savedKey) {
      geminiKeyInput.value = savedKey;
    }

    geminiKeyInput.addEventListener('input', () => {
      localStorage.setItem('jarvis_api_key', geminiKeyInput.value.trim());
    });

    // Habaynta Aqoonsiga Codka
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'so-SO'; 
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.textContent = '⏹️';
        statusText.textContent = 'Waan ku dhagaysanayaa...';
        toggleVisualizer(true);
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎙️';
        statusText.textContent = 'Diyaar u ah inuu ku maqlo';
        toggleVisualizer(false);
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        appendMessage(text, 'user');
        processAIResponse(text);
      };

      recognition.onerror = () => {
        statusText.textContent = 'Khalad ayaa dhacay, mar kale isku day.';
        toggleVisualizer(false);
      };
    } else {
      statusText.textContent = 'Browser-kaagu ma taageero codka.';
      micBtn.disabled = true;
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.textContent = text;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function toggleVisualizer(active) {
      bars.forEach(bar => {
        if (active) bar.classList.add('active');
        else bar.classList.remove('active');
      });
    }

    // Ku hadalka jawaabta
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'so-SO';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        statusText.textContent = 'Waan hadlayaa...';
        toggleVisualizer(true);

        utterance.onend = () => {
          statusText.textContent = 'Diyaar u ah inuu ku maqlo';
          toggleVisualizer(false);
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    // Ku xidhnaanshaha Gemini API
    async function processAIResponse(userPrompt) {
      const apiKey = geminiKeyInput.value.trim();
      if (!apiKey) {
        appendMessage("Fadlan geli Gemini API Key kaaga sanduuqa xagga hoose si aan kuu fahmo.", 'ai');
        speakText("Fadlan geli Gemini API Key kaaga sanduuqa xagga hoose.");
        return;
      }

      statusText.textContent = 'JARVIS wuu ka fikirayaa...';
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }]
          })
        });

        const data = await response.json();
        if (response.ok && data.candidates) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, 'ai');
          speakText(reply);
        } else {
          const errorMsg = "Waan ka xumahay, kuma xidhiidhi karo server-ka.";
          appendMessage(errorMsg, 'ai');
          speakText(errorMsg);
        }
      } catch (error) {
        const errorMsg = "Cillad xidhiidhka ah ayaa dhacday.";
        appendMessage(errorMsg, 'ai');
        speakText(errorMsg);
        statusText.textContent = 'Khalad ayaa dhacay';
      }
    }
  </script>
</body>
</html>
