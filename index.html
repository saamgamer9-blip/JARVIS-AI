<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS — Gemini Auto</title>
  <style>
    :root {
      --bg-top: #040508;
      --bg-mid: #050811;
      --bg-bottom-glow: rgba(29, 78, 216, 0.22);
      --surface: rgba(20, 22, 29, 0.92);
      --surface-elevated: rgba(30, 34, 45, 0.96);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent-blue: #4285f4;
      --accent-purple: #9b72cb;
      --accent-red: #d96570;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 100%, var(--bg-bottom-glow), transparent 58%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 65%, #070d24 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 14px 18px;
    }

    /* Top Bar */
    .topbar {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 2px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1.2rem;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
      font-weight: 500;
      color: #e5e7eb;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 10px;
    }

    .mode-pill:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid rgba(155, 114, 203, 0.7);
      background: #111827;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Optional Drawer / API Bar */
    .api-drawer {
      max-width: 820px;
      width: 100%;
      margin: 8px auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      display: none;
      gap: 10px;
      flex-direction: column;
    }

    .api-drawer.open {
      display: flex;
    }

    .api-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .api-row input, .api-row select {
      flex: 1;
      min-width: 180px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(10, 12, 18, 0.9);
      color: var(--text);
      font-size: 0.88rem;
    }

    .mini-note {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.35;
    }

    /* Center Hero & Messages */
    .main-area {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 4px;
      overflow-y: auto;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      margin: auto 0;
      padding: 24px 8px;
    }

    .gemini-sparkle {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-red));
      clip-path: polygon(
        50% 0%,
        62% 38%,
        100% 50%,
        62% 62%,
        50% 100%,
        38% 62%,
        0% 50%,
        38% 38%
      );
      filter: drop-shadow(0 0 12px rgba(114, 137, 218, 0.45));
    }

    .hero h1 {
      font-size: clamp(1.5rem, 4.5vw, 2.05rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #f9fafb;
    }

    .messages {
      display: none;
      flex-direction: column;
      gap: 12px;
      max-height: 58vh;
      overflow-y: auto;
      padding-bottom: 8px;
    }

    .messages.has-items {
      display: flex;
    }

    .hero.hidden {
      display: none;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 0.94rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #252b3b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 85%;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: rgba(17, 21, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 92%;
    }

    .bubble.error {
      align-self: flex-start;
      background: rgba(127, 29, 29, 0.45);
      border: 1px solid var(--danger);
      color: #fecaca;
      max-width: 95%;
    }

    .attached-preview {
      max-width: 170px;
      max-height: 170px;
      border-radius: 10px;
      margin-top: 8px;
      display: block;
      border: 1px solid var(--border);
    }

    /* Bottom Composer Card */
    .composer-wrap {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 14px 16px 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 8px;
    }

    .status-link {
      background: transparent;
      border: none;
      color: #e5e7eb;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .status-link:hover {
      text-decoration: underline;
    }

    .pending-file {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-elevated);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #d1d5db;
    }

    .pending-file.show {
      display: flex;
    }

    .input-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #promptField {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      resize: none;
      min-height: 24px;
      max-height: 120px;
    }

    #promptField::placeholder {
      color: #d1d5db;
      opacity: 0.9;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .left-actions, .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .round-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #e5e7eb;
      font-size: 1.25rem;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .round-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .live-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #2b344b;
      color: #eef2ff;
      font-weight: 600;
      font-size: 0.85rem;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .live-btn.active {
      background: #4285f4;
      color: #ffffff;
    }

    .send-chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: #3b82f6;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .send-chip:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <button id="menuBtn" class="icon-btn" title="Furaha API & Dejinta" aria-label="Menu">☰</button>
      <button id="modelCycleBtn" class="mode-pill" title="Beddel qaabka model-ka">
        <span id="modelLabel">Gemini Auto</span>
        <span>⌄</span>
      </button>
    </div>
    <div class="top-right">
      <button id="newChatBtn" class="icon-btn" title="Wada-hadal cusub" aria-label="New chat">✎</button>
      <div id="avatarBtn" class="avatar-ring" title="Furaha API Key">
        <img src="IMG-20261119-WA0002.jpg" alt="Profile" onerror="this.style.display='none'" />
      </div>
    </div>
  </header>

  <section id="apiDrawer" class="api-drawer">
    <div class="api-row">
      <input
        type="password"
        id="apiKeyInput"
        placeholder="Ku dheji Gemini API Key (AIzaSy...)"
        autocomplete="off"
      />
      <select id="langSelect" title="Luuqadda">
        <option value="so-SO" selected>Soomaali (so-SO)</option>
        <option value="en-US">English (en-US)</option>
        <option value="ar-SA">العربية (ar-SA)</option>
      </select>
    </div>
    <p class="mini-note">
      Fiiro gaar ah: Geli API key ka bilaabma <code>AIza...</code>. Furayaasha <code>AQ...</code> waa auth token oo kuma shaqeeyaan <code>?key=</code> ee REST API.
    </p>
  </section>

  <main class="main-area">
    <div id="heroSection" class="hero">
      <div class="gemini-sparkle" aria-hidden="true"></div>
      <h1 id="greetingTitle">Ask away, JARVIS!</h1>
    </div>
    <div id="messagesList" class="messages"></div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <div class="status-strip">
        <span id="statusText">API Key Settings • Tap + or Menu</span>
        <button id="toggleApiBtn" class="status-link" type="button">API Key</button>
      </div>

      <div id="pendingFileBar" class="pending-file">
        <span id="pendingFileName">Fayl la doortay</span>
        <button id="removeFileBtn" class="status-link" type="button">Ka saar ✕</button>
      </div>

      <div class="input-line">
        <textarea
          id="promptField"
          rows="1"
          placeholder="Try @ for more"
        ></textarea>
      </div>

      <div class="action-bar">
        <div class="left-actions">
          <input type="file" id="fileInput" accept="image/*" hidden />
          <button id="plusBtn" class="round-btn" type="button" title="Ku dar sawir">+</button>
        </div>
        <div class="right-actions">
          <button id="micBtn" class="round-btn" type="button" title="Ku hadal codkaaga">🎤</button>
          <button id="sendBtn" class="send-chip" type="button">Dir</button>
          <button id="liveBtn" class="live-btn" type="button" title="Akhri jawaabta (Voice)">|||</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MODELS = ["gemini-2.5-flash", "gemini-2.0-flash"];
    let modelIndex = 0;
    let lastReplyText = "";
    let attachedImageBase64 = null;
    let attachedImageMime = null;

    const menuBtn = document.getElementById("menuBtn");
    const toggleApiBtn = document.getElementById("toggleApiBtn");
    const avatarBtn = document.getElementById("avatarBtn");
    const apiDrawer = document.getElementById("apiDrawer");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const langSelect = document.getElementById("langSelect");
    const modelCycleBtn = document.getElementById("modelCycleBtn");
    const modelLabel = document.getElementById("modelLabel");
    const newChatBtn = document.getElementById("newChatBtn");
    const heroSection = document.getElementById("heroSection");
    const messagesList = document.getElementById("messagesList");
    const statusText = document.getElementById("statusText");
    const promptField = document.getElementById("promptField");
    const plusBtn = document.getElementById("plusBtn");
    const fileInput = document.getElementById("fileInput");
    const pendingFileBar = document.getElementById("pendingFileBar");
    const pendingFileName = document.getElementById("pendingFileName");
    const removeFileBtn = document.getElementById("removeFileBtn");
    const micBtn = document.getElementById("micBtn");
    const sendBtn = document.getElementById("sendBtn");
    const liveBtn = document.getElementById("liveBtn");

    const savedKey = localStorage.getItem("jarvis_gemini_key");
    if (savedKey) {
      apiKeyInput.value = savedKey;
    }

    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("jarvis_gemini_key", apiKeyInput.value.trim());
    });

    function toggleDrawer() {
      apiDrawer.classList.toggle("open");
    }

    menuBtn.addEventListener("click", toggleDrawer);
    toggleApiBtn.addEventListener("click", toggleDrawer);
    avatarBtn.addEventListener("click", toggleDrawer);

    modelCycleBtn.addEventListener("click", () => {
      modelIndex = (modelIndex + 1) % MODELS.length;
      modelLabel.textContent = modelIndex === 0 ? "Gemini Auto" : MODELS[modelIndex];
    });

    newChatBtn.addEventListener("click", () => {
      messagesList.innerHTML = "";
      messagesList.classList.remove("has-items");
      heroSection.classList.remove("hidden");
      statusText.textContent = "Wada-hadal cusub ayaa diyaar ah";
    });

    plusBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const result = String(reader.result || "");
        const commaSplit = result.split(",");
        if (commaSplit.length === 2) {
          attachedImageBase64 = commaSplit[1];
          attachedImageMime = file.type || "image/jpeg";
          pendingFileName.textContent = `Sawir: ${file.name}`;
          pendingFileBar.classList.add("show");
        }
      };
      reader.readAsDataURL(file);
    });

    removeFileBtn.addEventListener("click", () => {
      attachedImageBase64 = null;
      attachedImageMime = null;
      fileInput.value = "";
      pendingFileBar.classList.remove("show");
    });

    function addBubble(text, role = "assistant", imgDataUrl = null) {
      heroSection.classList.add("hidden");
      messagesList.classList.add("has-items");

      const div = document.createElement("div");
      div.className = `bubble ${role}`;
      div.textContent = text;

      if (imgDataUrl) {
        const img = document.createElement("img");
        img.src = imgDataUrl;
        img.alt = "Uploaded attachment";
        img.className = "attached-preview";
        div.appendChild(img);
      }

      messagesList.appendChild(div);
      messagesList.scrollTop = messagesList.scrollHeight;

      if (role === "assistant") {
        lastReplyText = text;
      }
    }

    async function requestGemini(promptText) {
      const key = apiKeyInput.value.trim();
      if (!key) {
        apiDrawer.classList.add("open");
        throw new Error("Fadlan ku dheji Gemini API Key sanduuqa sare.");
      }
      if (key.startsWith("AQ.")) {
        throw new Error(
          "Furaha 'AQ.' waa auth token oo kuma shaqeeyo ?key= ee REST API. Fadlan isticmaal key ka bilaabma 'AIza...'."
        );
      }

      const candidateModels =
        modelIndex === 0 ? MODELS
