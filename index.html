<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Auto</title>
  <style>
    :root {
      --bg-dark: #050b14;
      --surface: #111927;
      --surface-hover: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, #312e81 0%, transparent 40%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow-y: auto;
    }

    .sparkle-icon {
      font-size: 3rem;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }

    /* Bottom Input Area */
    .input-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto 24px;
      padding: 0 16px;
    }

    .input-wrapper {
      background-color: var(--surface);
      border-radius: 30px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-blue);
    }

    .plus-btn {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .submit-btn {
      background-color: var(--text-main);
      color: var(--bg-dark);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
    }

    .mic-btn.recording {
      color: #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    #responseArea {
      margin-top: 20px;
      max-width: 600px;
      width: 100%;
      text-align: left;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-left">
      <button class="icon-btn" aria-label="Menu">☰</button>
      <div class="logo-text">Gemini Auto ▾</div>
    </div>
    <div class="nav-right">
      <button class="icon-btn" aria-label="Edit">✎</button>
      <div class="profile-img">U</div>
    </div>
  </header>

  <main>
    <div class="sparkle-icon">✨</div>
    <h1>What should we focus on?</h1>
    <div id="responseArea"></div>
  </main>

  <div class="input-container">
    <div class="input-wrapper">
      <button class="plus-btn" id="attachBtn">+</button>
      <input type="text" id="userInput" placeholder="Try @ for more">
      <button class="action-btn mic-btn" id="micBtn" title="Hadalka">🎙️</button>
      <button class="submit-btn" id="sendBtn" title="Dir">➤</button>
    </div>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const responseArea = document.getElementById('responseArea');
    let isRecording = false;

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'so-SO';
      recognition.continuous = false;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        userInput.placeholder = "Dhageysiga...";
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        userInput.placeholder = "Try @ for more";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        processInput(transcript);
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert("Codka laguma taageero browser-kan.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    sendBtn.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (text) {
        processInput(text);
        userInput.value = '';
      }
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const text = userInput.value.trim();
        if (text) {
          processInput(text);
          userInput.value = '';
        }
      }
    });

    function processInput(text) {
      responseArea.textContent = "Processing: " + text;
      speakResponse("Waxaan ka shaqeynayaa codsigaaga: " + text);
    }

    function speakResponse(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'so-SO';
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
