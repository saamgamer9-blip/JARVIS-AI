<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Gamer</title>
  <style>
    :root {
      --bg-overlay: rgba(10, 12, 18, 0.75);
      --surface-color: rgba(20, 24, 33, 0.85);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --danger-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      /* Sawirkaaga ku kaydi isla meesha koodhku yaallo una bixi sawir.jpg */
      background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('sawir.jpg');
      background-color: #05070e;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #chatArea {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 0;
    }

    #chatArea::-webkit-scrollbar {
      width: 6px;
    }

    #chatArea::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .message {
      max-width: 85%;
      padding: 14px 20px;
      border-radius: 20px;
      font-size: 1rem;
      line-height: 1.5;
      word-break: break-word;
      backdrop-filter: blur(8px);
    }

    .message.user {
      align-self: flex-end;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .interface-controls {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 10px;
    }

    .config-panel {
      width: 100%;
      background: var(--surface-color);
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="password"] {
      flex: 1;
      background: rgba(5, 7, 14, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
    }

    #saveKeyBtn {
      background: var(--accent-color);
      color: #05070e;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .visualizer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      height: 30px;
    }

    .bar {
      width: 4px;
      height: 12px;
      background-color: var(--accent-color);
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .bar.active {
      animation: bounce 1s infinite ease-in-out;
    }

    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { height: 12px; }
      50% { height: 40px; }
    }

    .action-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #micBtn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-color), #0284c7);
      color: #05070e;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px var(--accent-glow);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    #micBtn:hover {
      transform: scale(1.08);
    }

    #micBtn.recording {
      background: var(--danger-color);
      color: #fff;
      box-shadow: 0 0 35px rgba(244, 63, 94, 0.6);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Sam Gamer</h1>
    </div>
    <div class="status-container">
      <div class="indicator"></div>
      <div class="status-text" id="statusText">Diyaar u ah inuu ku maqlo</div>
    </div>
  </header>

  <main id="chatArea">
    <div class="message ai">
      Sam Gamer oo diyaar ah! Geli furahaaga Gemini API, riix Save, kadibna taabo makarafoonka.
    </div>
  </main>

  <div class="interface-controls">
    <div class="config-panel">
      <input type="password" id="geminiKey" placeholder="Ku dheji Gemini API Key...">
      <button id="saveKeyBtn">Save</button>
    </div>

    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="action-container">
      <button id="micBtn" aria-label="Microphone">🎙️</button>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const geminiKeyInput = document.getElementById('geminiKey');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const bars = document.querySelectorAll('.bar');

    let recognition;
    let isRecording = false;

    const savedKey = localStorage.getItem('sam_gamer_key');
    if (savedKey) {
      geminiKeyInput.value = savedKey;
    }

    function saveApiKey() {
      const key = geminiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('sam_gamer_key', key);
        geminiKeyInput.blur(); // Xidh keyboard-ka
        statusText.textContent = 'Furaha waa la kaydiyay!';
        appendMessage("Furahaaga API waa la kaydiyay. Hadda waad hadli kartaa.", 'ai');
      }
    }

    saveKeyBtn.addEventListener('click', saveApiKey);

    // Oggolow in badhanka Enter/Go ee keyboard-ku uu shaqeeyo
    geminiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveApiKey();
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'so-SO';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.textContent = '⏹️';
        statusText.textContent = 'Waan ku dhagaysanayaa...';
        toggleVisualizer(true);
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎙️';
        statusText.textContent = 'Diyaar u ah inuu ku maqlo';
        toggleVisualizer(false);
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        appendMessage(text, 'user');
        processAIResponse(text);
      };

      recognition.onerror = () => {
        statusText.textContent = 'Khalad ayaa dhacay.';
        toggleVisualizer(false);
      };
    } else {
      statusText.textContent = 'Browser-kaagu ma taageero codka.';
      micBtn.disabled = true;
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.textContent = text;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function toggleVisualizer(active) {
      bars.forEach(bar => {
        if (active) bar.classList.add('active');
        else bar.classList.remove('active');
      });
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        
        const voices = window.speechSynthesis.getVoices();
        let selectedVoice = voices.find(voice => voice.lang.includes('so') || voice.lang.includes('en'));
        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        statusText.textContent = 'Waan hadlayaa...';
        toggleVisualizer(true);

        utterance.onend = () => {
          statusText.textContent = 'Diyaar u ah inuu ku maqlo';
          toggleVisualizer(false);
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    async function processAIResponse(userPrompt) {
      const apiKey = geminiKeyInput.value.trim();
      if (!apiKey) {
        appendMessage("Fadlan geli Gemini API Key kaaga.", 'ai');
        speakText("Fadlan geli furahaaga API.");
        return;
      }

      statusText.textContent = 'Sam Gamer wuu ka fikirayaa...';
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }]
          })
        });

        const data = await response.json();
        if (response.ok && data.candidates) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, 'ai');
          speakText(reply);
        } else {
          const errorMsg = "Kuma xidhiidhi karo server-ka. Hubi furahaaga API.";
          appendMessage(errorMsg, 'ai');
          speakText(errorMsg);
        }
      } catch (error) {
        const errorMsg = "Cillad xidhiidhka ah ayaa dhacday.";
        appendMessage(errorMsg, 'ai');
        speakText(errorMsg);
      }
    }
  </script>
</body>
</html>
