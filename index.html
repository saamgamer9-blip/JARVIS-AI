<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Gamer</title>
  <style>
    :root {
      --bg-overlay: rgba(10, 12, 18, 0.75);
      --surface-color: rgba(20, 24, 33, 0.85);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --danger-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      /* Sawirkaaga ku kaydi isla meesha koodhku yaallo una bixi sawir.jpg */
      background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('sawir.jpg');
      background-color: #05070e;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #chatArea {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 0;
    }

    #chatArea::-webkit-scrollbar {
      width: 6px;
    }

      background: rgba(255, 255, 255
